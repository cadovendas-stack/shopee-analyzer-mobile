name: Gerar APK Shopee Analyzer

on:
  workflow_dispatch:
  push:
    paths:
      - 'PROJETO-SHOPEE-ANALYZER.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto
        run: |
          rm -rf project
          mkdir project
          unzip -q PROJETO-SHOPEE-ANALYZER.zip -d project

      - name: Compilar APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Shopee-Analyzer-Mobile.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopee-Analyzer-Mobile-APK
          path: Shopee-Analyzer-Mobile.apk
          if-no-files-found: error
          retention-days: 30
